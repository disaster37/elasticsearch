name: "build"

on:
  push:
    branches:
      - main
      - release-branch.v9
      - v9
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - release-branch.v9
      - v9

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
      - name: Call Dagger Function
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "0.21.10"
          verb: call
          args: --src . ci --ci --code-cove-token env:CODECOV_TOKEN --git-token env:GITHUB_TOKEN --git-branch ${BRANCH_NAME} ${IS_TAG}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ github.ref_type == 'tag' && '--is-tag' || '' }}
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_type == 'tag' && 'main' || github.ref_name }}
